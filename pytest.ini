[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --cov-report=term-missing --cov-report=xml --cov-fail-under=0 -W ignore::DeprecationWarning -W ignore::UserWarning
markers =
    integration: Tests that exercise integrated application flows or external dependencies
    security: Tests that validate authentication, authorization, and data exposure safeguards
