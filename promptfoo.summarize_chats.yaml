configVersion: 1

description: Summarize short multi-agent conversations

providers:
  - id: openai:gpt-4o-mini
    config:
      temperature: 0.2

prompts:
  - label: summarize_chats
    raw: |
      Conversation:
      """
      {{conversation}}
      """

      Summarize the above conversation in one sentence no longer than 100 characters.

defaultTest:
  vars:
    conversation: |
      Police: We need to prepare for tomorrow's crowd safety briefing at the concert venue.
      Orchestra: We'll finalize the setlist timings tonight and coordinate stage access.
      Police: Please also confirm the venue entry flow with the Crowd marshals.
      Orchestra: Understood, we'll align with the Crowd volunteers now.

tests:
  - description: Short summary (Crowd and Orchestra)
    vars:
      conversation: |
        Crowd: The concert briefing is tomorrow and needs preparation.
        Orchestra: We'll finalize setlist timings tonight and confirm entry flow.
