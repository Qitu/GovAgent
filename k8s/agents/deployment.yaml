apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-service
  namespace: agents-ns
  labels:
    app: agents-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agents-service
  template:
    metadata:
      labels:
        app: agents-service
    spec:
      serviceAccountName: agents-service-account
      containers:
      - name: agents-service
        image: ghcr.io/gov-agents/agents-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: agents-config
        - secretRef:
            name: agents-service-credentials
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
        - mountPath: /var/log/agents
          name: agents-logs
      volumes:
      - name: agents-logs
        emptyDir: {}
