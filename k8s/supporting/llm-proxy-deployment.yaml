apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-proxy
  namespace: supporting-ns
  labels:
    app: llm-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-proxy
  template:
    metadata:
      labels:
        app: llm-proxy
    spec:
      serviceAccountName: llm-proxy-service-account
      containers:
      - name: llm-proxy
        image: ghcr.io/gov-agents/llm-proxy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: llm-proxy-config
        - secretRef:
            name: llm-provider-api-keys
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
