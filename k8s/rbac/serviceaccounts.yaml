apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-service-account
  namespace: agents-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-config-reader
  namespace: agents-ns
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-config-reader-binding
  namespace: agents-ns
subjects:
- kind: ServiceAccount
  name: agents-service-account
  namespace: agents-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agents-config-reader
---
