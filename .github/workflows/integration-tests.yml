name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          guardrails hub install hub://guardrails/regex_match

      - name: Configure Guardrails API key
        run: guardrails configure --profile ci --api-key ${{ secrets.GUARDRAILS_API_KEY }} --no-telemetry --no-remote

      - name: Run integration tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          GUARDRAILS_PROFILE: ci
        run: |
          pytest tests/integration -q --cov=generative_agents --cov-report=term-missing --cov-report=xml:coverage-integration.xml

      - name: Upload integration test coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload integration coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: ignore
