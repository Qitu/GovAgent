name: Prompt Tests - generate_chat_check_repeat

on:
  workflow_dispatch:
  push:
    paths:
      - "generative_agents/data/prompts/**"
      - "promptfoo.generate_chat_check_repeat.yaml"
      - "scripts/run_prompt_tests.sh"
      - ".github/workflows/prompt-tests.generate_chat_check_repeat.yml"
  pull_request:
    paths:
      - "generative_agents/data/prompts/**"
      - "promptfoo.generate_chat_check_repeat.yaml"
      - "scripts/run_prompt_tests.sh"

jobs:
  eval-generate-chat-check-repeat:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' && secrets.OPENAI_API_KEY || secrets.OPENAI_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install promptfoo
        run: |
          npm i -g promptfoo
          promptfoo --version

      - name: Check OPENAI_API_KEY presence
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is empty. Configure repository secret OPENAI_API_KEY (or OPENAI_KEY as fallback).";
            exit 1;
          fi
          echo "OPENAI_API_KEY length: ${#OPENAI_API_KEY} (masked)"

      - name: Run generate_chat_check_repeat prompt tests
        run: |
          bash scripts/run_prompt_tests.sh promptfoo.generate_chat_check_repeat.yaml generate_chat_check_repeat.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-generate_chat_check_repeat
          path: results/promptfoo/generate_chat_check_repeat.json
