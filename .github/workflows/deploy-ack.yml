name: Deploy to Alibaba Cloud ACK

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'simulation_jobs/**'
      - 'frontend/**'
      - 'llm_proxy/**'
      - 'k8s/**'
      - '.github/workflows/deploy-ack.yml'
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ACR_REGISTRY }}
  REGISTRY_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_PREFIX: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}
  K8S_OVERLAY: k8s/overlays/prod

jobs:
  build-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ack-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Determine deployment tag
        id: vars
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          IMAGE="${IMAGE_PREFIX}/backend:${{ steps.vars.outputs.tag }}"
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE" -f backend/Dockerfile . --push

      - name: Build and push simulation jobs image
        run: |
          IMAGE="${IMAGE_PREFIX}/simulation-jobs:${{ steps.vars.outputs.tag }}"
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE" -f simulation_jobs/Dockerfile . --push

      - name: Build and push frontend image
        run: |
          IMAGE="${IMAGE_PREFIX}/frontend:${{ steps.vars.outputs.tag }}"
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE" -f frontend/Dockerfile . --push

      - name: Build and push LLM proxy image
        run: |
          IMAGE="${IMAGE_PREFIX}/llm-proxy:${{ steps.vars.outputs.tag }}"
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE" -f llm_proxy/Dockerfile . --push

  render-manifests:
    name: Render Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-images
    concurrency:
      group: deploy-ack-render-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: '5.3.0'

      - name: Update images in overlay
        working-directory: ${{ env.K8S_OVERLAY }}
        run: |
          kustomize edit set image ghcr.io/gov-agents/agents-service=${IMAGE_PREFIX}/backend:${{ needs.build-images.outputs.tag }}
          kustomize edit set image ghcr.io/gov-agents/simulation-controller=${IMAGE_PREFIX}/simulation-jobs:${{ needs.build-images.outputs.tag }}
          kustomize edit set image ghcr.io/gov-agents/web-frontend=${IMAGE_PREFIX}/frontend:${{ needs.build-images.outputs.tag }}
          kustomize edit set image ghcr.io/gov-agents/llm-proxy=${IMAGE_PREFIX}/llm-proxy:${{ needs.build-images.outputs.tag }}
          kustomize build . > ../rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests-${{ needs.build-images.outputs.tag }}
          path: k8s/overlays/rendered-manifests.yaml
          if-no-files-found: error

  deploy:
    name: Deploy to ACK
    runs-on: ubuntu-latest
    needs: render-manifests
    concurrency:
      group: deploy-ack-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests-${{ needs.build-images.outputs.tag }}
          path: artifacts

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.ACK_KUBECONFIG_B64 }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        run: |
          kubectl apply -f artifacts/rendered-manifests.yaml

      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/agents-service -n agents-ns --timeout=180s
          kubectl rollout status deployment/simulation-controller -n simulation-ns --timeout=180s
          kubectl rollout status deployment/web-frontend -n frontend-ns --timeout=180s
          kubectl rollout status deployment/llm-proxy -n supporting-ns --timeout=180s
