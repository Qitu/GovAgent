name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run security tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/security -q --cov=generative_agents --cov-report=term-missing --cov-report=xml:coverage-security.xml

      - name: Upload security test coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-security.xml
          flags: security
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload security coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-security
          path: coverage-security.xml
          if-no-files-found: ignore
