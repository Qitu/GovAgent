name: CI&CD

# Set the event to pull request event and push event of the [main] branch
on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: write

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Lint check
      #   run: |
      #     pip install ruff
      #     ruff check .

  Guardrails:
    runs-on: ubuntu-latest
    needs: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          guardrails configure --token "$GUARDRAILS_API_KEY"

      - name: Apply Guardrails config overrides
        run: |
          CONFIG_PATH="$HOME/.guardrails/config.toml"
          python - <<'PY'
from pathlib import Path
cfg = Path("~/.guardrails/config.toml").expanduser()
text = cfg.read_text() if cfg.exists() else ""
if "enable_metrics" in text:
    text = text.replace("enable_metrics = true", "enable_metrics = false")
else:
    text += "\nenable_metrics = false\n"
if "use_remote_inferencing" in text:
    text = text.replace("use_remote_inferencing = true", "use_remote_inferencing = false")
else:
    text += "use_remote_inferencing = false\n"
Path("~/.guardrails/config.toml").expanduser().write_text(text)
PY

      - name: Run Guardrails prompt tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/integration/test_guardrails_prompt.py -q

  CD:
    runs-on: ubuntu-latest
    needs: Guardrails
    steps:
      - name: Deploy to dev server (Baota)
        uses: appleboy/ssh-action@master
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.DEV }}
          port: 22
          envs: GITHUB_USERNAME, GITHUB_TOKEN
          script: |
            cd GovAgent
            git fetch --all
            git reset --hard origin/main
            git pull
            cd generative_agents
            bash /root/project_start.sh
