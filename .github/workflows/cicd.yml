name: CI&CD

# Set the event to pull request event and push event of the [main] branch
on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: write

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Lint check
      #   run: |
      #     pip install ruff
      #     ruff check .

  Guardrails:
    runs-on: ubuntu-latest
    needs: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Guardrails settings
        env:
          GUARDRAILS_API_KEY: ${{ secrets.GUARDRAILS_API_KEY }}
        run: |
          uuid_value="$(uuidgen 2>/dev/null || echo gr-$(date +%s))"
          token_value="${GUARDRAILS_API_KEY:-}"
          {
            echo "id=${uuid_value}"
            echo "token=${token_value}"
            echo "enable_metrics=false"
            echo "use_remote_inferencing=false"
            echo
          } > "$HOME/.guardrailsrc"

      - name: Run Guardrails prompt tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/integration/test_guardrails_prompt.py -q

      - name: Report Guardrails summary
        run: |
          {
            echo "### Prompt Guardrails"
            echo
            echo "- Pre-screen user input."
            echo "- Block known toxic terms."
            echo "- Redirect or refuse unsafe prompts."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  CD:
    runs-on: ubuntu-latest
    needs: Guardrails
    steps:
      - name: Deploy to dev server (Baota)
        uses: appleboy/ssh-action@master
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.DEV }}
          port: 22
          envs: GITHUB_USERNAME, GITHUB_TOKEN
          script: |
            cd GovAgent
            git fetch --all
            git reset --hard origin/main
            git pull
            cd generative_agents
            bash /root/project_start.sh
